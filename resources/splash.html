<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lofi Player Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-app-region: drag;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease-out;
    }

    body.fade-out {
      opacity: 0;
    }

    .splash-card {
      position: relative;
      width: 500px;
      height: 320px;
      border-radius: 18px;
      overflow: hidden;
      background-color: #14161f;
      background-image: 
        linear-gradient(180deg, rgba(20, 22, 31, 0.45) 0%, rgba(20, 22, 31, 0.85) 60%, #14161f 100%),
        url('splash.png');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.75), 0 0 30px rgba(245, 158, 11, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 28px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f3f4f6;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f59e0b;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .bottom-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #e5e7eb;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      transition: opacity 0.25s ease, transform 0.25s ease;
      min-height: 18px;
    }

    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 3.5px;
      height: 16px;
    }

    .bar {
      width: 3px;
      border-radius: 3px;
      background: linear-gradient(180deg, #f59e0b, #ec4899);
      animation: bounce 1.1s ease-in-out infinite alternate;
    }

    .bar:nth-child(1) { height: 60%; animation-delay: 0.0s; }
    .bar:nth-child(2) { height: 100%; animation-delay: 0.2s; }
    .bar:nth-child(3) { height: 40%; animation-delay: 0.4s; }
    .bar:nth-child(4) { height: 80%; animation-delay: 0.1s; }
    .bar:nth-child(5) { height: 50%; animation-delay: 0.3s; }

    @keyframes bounce {
      0% { transform: scaleY(0.3); opacity: 0.6; }
      100% { transform: scaleY(1.1); opacity: 1; }
    }

    .progress-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #ec4899, #8b5cf6);
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="top-bar">
      <div class="brand">
        <img class="brand-icon" src="icon.ico" alt="Logo" onerror="this.style.display='none'">
        <span class="brand-name">Lofi Player</span>
      </div>
      <span class="badge">v1.1.0</span>
    </div>

    <div class="bottom-section">
      <div class="status-row">
        <div id="statusText" class="status-text">☕ Brewing cozy coffee...</div>
        <div class="eq-bars">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>

      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    const messages = [
      '☕ Brewing cozy coffee...',
      '📼 Calibrating cassette tape & vinyl...',
      '🌧️ Mixing ambient rain atmosphere...',
      '🎧 Preparing audio visualizers...',
      '✨ Ready for focus!'
    ];

    const statusEl = document.getElementById('statusText');
    const progressEl = document.getElementById('progressBar');
    
    const DURATION = 3000;
    const startTime = Date.now();
    let msgIndex = 0;

    // Update progress bar
    const progressInterval = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(100, (elapsed / DURATION) * 100);
      progressEl.style.width = progress + '%';

      if (elapsed >= DURATION) {
        clearInterval(progressInterval);
      }
    }, 30);

    // Rotate status messages smoothly
    const msgInterval = setInterval(() => {
      msgIndex++;
      if (msgIndex < messages.length) {
        statusEl.style.opacity = '0';
        statusEl.style.transform = 'translateY(4px)';
        setTimeout(() => {
          statusEl.textContent = messages[msgIndex];
          statusEl.style.opacity = '1';
          statusEl.style.transform = 'translateY(0)';
        }, 150);
      } else {
        clearInterval(msgInterval);
      }
    }, 700);
  </script>
</body>
</html>
