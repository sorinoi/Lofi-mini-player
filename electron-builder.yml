appId: com.lofiplayer.desktop
productName: Lofi Player
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - resources/**/*
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  executableName: LofiPlayer
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Lofi Player
